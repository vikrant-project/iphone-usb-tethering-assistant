name: Build iOS Sideloadable IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Compile & Package IPA on macOS
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Build Unsigned App Binary
        run: |
          cd ios
          xcodebuild clean build \
            -project TetherAssistant.xcodeproj \
            -scheme TetherAssistant \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package into Sideloadable IPA
        run: |
          cd ios
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/TetherAssistant.app Payload/
          zip -r TetherAssistant.ipa Payload
          ls -lh TetherAssistant.ipa

      - name: Upload Sideloadable IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TetherAssistant-iOS-IPA
          path: ios/TetherAssistant.ipa
          retention-days: 14
